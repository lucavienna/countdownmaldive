<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Countdown Maldive</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 420px;
      min-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-bg {
      position: absolute;
      inset: 0;
      background: url('./bg.jpg') center/cover no-repeat;
      z-index: 0;
    }

    .card-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.55) 0%,
        rgba(0,0,0,0.32) 35%,
        rgba(0,0,0,0.50) 65%,
        rgba(0,0,0,0.75) 100%
      );
    }

    .card-content {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 44px 28px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* COUNTDOWN ROW principale */
    .countdown-main {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      width: 100%;
    }

    .cd-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cd-num {
      font-size: clamp(36px, 11vw, 58px);
      font-weight: 900;
      color: #fff;
      line-height: 1;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
      animation: breathe 4s ease-in-out infinite;
    }

    .cd-num.tick {
      animation: tickpop 280ms ease-out forwards, breathe 4s ease-in-out 280ms infinite;
    }

    /* Secondi: metà dimensione */
    .cd-unit.small .cd-num {
      font-size: clamp(18px, 5.5vw, 29px);
      letter-spacing: -0.5px;
    }

    .cd-label {
      font-size: clamp(9px, 2.6vw, 12px);
      font-weight: 600;
      color: rgba(255,255,255,0.70);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .cd-unit.small .cd-label {
      font-size: clamp(8px, 2.2vw, 10px);
    }

    .cd-sep {
      font-size: clamp(28px, 9vw, 44px);
      font-weight: 900;
      color: rgba(255,255,255,0.4);
      line-height: 1;
      padding-bottom: 18px;
      flex-shrink: 0;
    }

    /* separatore più piccolo prima dei secondi */
    .cd-sep.small {
      font-size: clamp(14px, 4.5vw, 22px);
      padding-bottom: 14px;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.015); }
    }
    @keyframes tickpop {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.07); filter: brightness(1.18); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    .divider {
      width: 75%;
      height: 1px;
      background: rgba(255,255,255,0.30);
      margin: 16px 0 18px;
    }

    /* DESTINAZIONE */
    .dest-title-1 {
      font-size: clamp(28px, 9vw, 40px);
      font-weight: 900;
      color: #fff;
      line-height: 1.05;
      text-align: center;
      text-shadow: 0 2px 16px rgba(0,0,0,0.5);
      letter-spacing: 0.04em;
    }

    .dest-title-2 {
      font-size: clamp(17px, 5.5vw, 24px);
      font-weight: 700;
      color: rgba(255,255,255,0.88);
      line-height: 1.1;
      text-align: center;
      text-shadow: 0 2px 12px rgba(0,0,0,0.4);
      margin-bottom: 8px;
    }

    .dest-dates {
      font-size: clamp(13px, 3.8vw, 16px);
      font-weight: 600;
      color: rgba(255,255,255,0.82);
      text-align: center;
      margin-bottom: 18px;
    }

    /* DETTAGLI centrati */
    .details {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .detail-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: clamp(13px, 3.8vw, 16px);
      font-weight: 600;
      color: rgba(255,255,255,0.90);
      text-align: center;
    }

    .detail-icon {
      font-size: clamp(15px, 4.5vw, 19px);
      flex-shrink: 0;
    }

    @media (min-width: 500px) {
      html, body { background: #111; }
      .card {
        min-height: auto;
        border-radius: 28px;
        box-shadow: 0 24px 80px rgba(0,0,0,0.7);
        margin: 40px auto;
      }
      .card-bg { border-radius: 28px; }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="card-bg"></div>
    <div class="card-content">

      <!-- COUNTDOWN -->
      <div class="countdown-main">
        <div class="cd-unit">
          <span class="cd-num" id="cd-days">00</span>
          <span class="cd-label">giorni</span>
        </div>
        <div class="cd-sep">:</div>
        <div class="cd-unit">
          <span class="cd-num" id="cd-hours">00</span>
          <span class="cd-label">ore</span>
        </div>
        <div class="cd-sep">:</div>
        <div class="cd-unit">
          <span class="cd-num" id="cd-mins">00</span>
          <span class="cd-label">min</span>
        </div>
        <div class="cd-sep small">:</div>
        <div class="cd-unit small">
          <span class="cd-num" id="cd-secs">00</span>
          <span class="cd-label">sec</span>
        </div>
      </div>

      <div class="divider"></div>

      <!-- DESTINAZIONE -->
      <div class="dest-title-1">MALDIVE</div>
      <div class="dest-title-2">Atollo di Vaavu</div>
      <div class="dest-dates">Partenza: 13 giugno 2026 · ore 14:00</div>

      <!-- DETTAGLI -->
      <div class="details">
        <div class="detail-row">
          <span class="detail-icon">🏝️</span>
          <span>Alimatha Aquatic Resort</span>
        </div>
        <div class="detail-row">
          <span class="detail-icon">🍹</span>
          <span>Formula Tutto Incluso a fare schifo proprio</span>
        </div>
        <div class="detail-row">
          <span class="detail-icon">👥</span>
          <span>7 adulti + 1 coach,<br>4 marmocchi e 1 principessina</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    const targetUTC = Date.UTC(2026, 5, 13, 12, 0, 0);

    const elDays  = document.getElementById('cd-days');
    const elHours = document.getElementById('cd-hours');
    const elMins  = document.getElementById('cd-mins');
    const elSecs  = document.getElementById('cd-secs');
    let prevD='', prevH='', prevM='', prevS='';

    function animateTick(el) {
      el.classList.remove('tick');
      void el.offsetWidth;
      el.classList.add('tick');
    }

    function update() {
      const diff = targetUTC - Date.now();
      if (diff <= 0) {
        [elDays, elHours, elMins, elSecs].forEach(e => e.textContent = '00');
        return;
      }
      const totalSecs = Math.floor(diff / 1000);
      const d = String(Math.floor(totalSecs / 86400)).padStart(2, '0');
      const h = String(Math.floor((totalSecs % 86400) / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSecs % 3600) / 60)).padStart(2, '0');
      const s = String(totalSecs % 60).padStart(2, '0');

      if (d !== prevD) { elDays.textContent  = d; animateTick(elDays);  prevD = d; }
      if (h !== prevH) { elHours.textContent = h; animateTick(elHours); prevH = h; }
      if (m !== prevM) { elMins.textContent  = m; animateTick(elMins);  prevM = m; }
      if (s !== prevS) { elSecs.textContent  = s; animateTick(elSecs);  prevS = s; }
    }

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
