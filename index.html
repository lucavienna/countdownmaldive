<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Countdown Maldive</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 420px;
      min-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-bg {
      position: absolute;
      inset: 0;
      background: url('./bg.jpg') center/cover no-repeat;
      z-index: 0;
    }

    .card-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.55) 0%,
        rgba(0,0,0,0.32) 35%,
        rgba(0,0,0,0.50) 65%,
        rgba(0,0,0,0.75) 100%
      );
    }

    .card-content {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 44px 28px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* COUNTDOWN */
    .countdown-digits {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 6px;
      width: 100%;
      margin-bottom: 6px;
    }

    .cd-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    .cd-num {
      font-size: clamp(36px, 11vw, 58px);
      font-weight: 900;
      color: #fff;
      line-height: 1;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
      animation: breathe 4s ease-in-out infinite;
    }

    .cd-num.tick {
      animation: tickpop 280ms ease-out forwards, breathe 4s ease-in-out 280ms infinite;
    }

    .cd-label {
      font-size: clamp(11px, 3vw, 14px);
      font-weight: 600;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .cd-sep {
      font-size: clamp(30px, 9vw, 46px);
      font-weight: 900;
      color: rgba(255,255,255,0.4);
      line-height: 1;
      padding-top: 4px;
      flex: 0;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.015); }
    }
    @keyframes tickpop {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.07); filter: brightness(1.18); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    .divider {
      width: 75%;
      height: 1px;
      background: rgba(255,255,255,0.30);
      margin: 18px 0 20px;
    }

    /* DESTINAZIONE */
    .dest-title {
      font-size: clamp(24px, 8vw, 36px);
      font-weight: 900;
      color: #fff;
      line-height: 1.1;
      text-align: center;
      text-shadow: 0 2px 16px rgba(0,0,0,0.5);
      margin-bottom: 8px;
    }

    .dest-dates {
      font-size: clamp(14px, 4vw, 17px);
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      text-align: center;
      margin-bottom: 20px;
    }

    /* DETTAGLI */
    .details {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .detail-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(14px, 4vw, 17px);
      font-weight: 600;
      color: rgba(255,255,255,0.90);
    }

    .detail-icon {
      font-size: clamp(17px, 5vw, 22px);
      flex-shrink: 0;
    }

    @media (min-width: 500px) {
      html, body { background: #111; }
      .card {
        min-height: auto;
        border-radius: 28px;
        box-shadow: 0 24px 80px rgba(0,0,0,0.7);
        margin: 40px auto;
      }
      .card-bg { border-radius: 28px; }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="card-bg"></div>
    <div class="card-content">

      <div class="countdown-digits">
        <div class="cd-unit">
          <span class="cd-num" id="cd-days">00</span>
          <span class="cd-label">giorni</span>
        </div>
        <div class="cd-sep">:</div>
        <div class="cd-unit">
          <span class="cd-num" id="cd-hours">00</span>
          <span class="cd-label">ore</span>
        </div>
        <div class="cd-sep">:</div>
        <div class="cd-unit">
          <span class="cd-num" id="cd-mins">00</span>
          <span class="cd-label">minuti</span>
        </div>
      </div>

      <div class="divider"></div>

      <div class="dest-title">Maldive – Atollo di Vaavu</div>
      <div class="dest-dates">13 giugno 2026 · ore 14:00</div>

      <div class="details">
        <div class="detail-row">
          <span class="detail-icon">🏝️</span>
          <span>Alimatha Aquatic Resort</span>
        </div>
        <div class="detail-row">
          <span class="detail-icon">🍹</span>
          <span>Formula Tutto Incluso</span>
        </div>
        <div class="detail-row">
          <span class="detail-icon">👥</span>
          <span>13 persone</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    const targetUTC = Date.UTC(2026, 5, 13, 12, 0, 0);

    const elDays  = document.getElementById('cd-days');
    const elHours = document.getElementById('cd-hours');
    const elMins  = document.getElementById('cd-mins');
    let prevD = '', prevH = '', prevM = '';

    function animateTick(el) {
      el.classList.remove('tick');
      void el.offsetWidth;
      el.classList.add('tick');
    }

    function update() {
      const diff = targetUTC - Date.now();
      if (diff <= 0) {
        elDays.textContent = elHours.textContent = elMins.textContent = '00';
        return;
      }
      const totalMins = Math.floor(diff / 60000);
      const d = String(Math.floor(totalMins / 1440)).padStart(2, '0');
      const h = String(Math.floor((totalMins % 1440) / 60)).padStart(2, '0');
      const m = String(totalMins % 60).padStart(2, '0');

      if (d !== prevD) { elDays.textContent  = d; animateTick(elDays);  prevD = d; }
      if (h !== prevH) { elHours.textContent = h; animateTick(elHours); prevH = h; }
      if (m !== prevM) { elMins.textContent  = m; animateTick(elMins);  prevM = m; }
    }

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
